<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorldIA 🌍</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef7ff}.app{max-width:520px;margin:auto;min-height:100vh;background:white;display:flex;flex-direction:column}header{background:linear-gradient(135deg,#087f8c,#1456a0);color:white;padding:24px 18px}h1{margin:0 0 6px}header p{margin:0}.chat{flex:1;padding:16px}.msg{max-width:88%;padding:12px 14px;border-radius:16px;margin:10px 0;line-height:1.4}.bot{background:#eef3f7}.user{background:#1456a0;color:white;margin-left:auto}.quick{display:flex;gap:8px;overflow:auto;padding:8px 16px}.quick button{border:0;border-radius:20px;padding:9px 13px;white-space:nowrap}form{display:flex;gap:8px;padding:12px;border-top:1px solid #ddd}input{flex:1;padding:13px;border:1px solid #bbb;border-radius:24px;font-size:16px}form button{border:0;border-radius:50%;width:48px;background:#1456a0;color:white;font-size:20px}footer{text-align:center;font-size:12px;color:#777;padding:8px}</style></head><body><div class="app"><header><h1>🌍 WorldIA</h1><p>Seu assistente sobre o mundo dos animais 🐾</p></header><div id="chat" class="chat"><div class="msg bot">Olá! Eu sou o <b>WorldIA</b> 🤖🐾<br><br>Pergunte sobre qualquer animal: alimentação, habitat, comportamento, cuidados e muito mais.</div></div><div class="quick"><button onclick="ask('O que os guppys comem?')">🐟 Guppy</button><button onclick="ask('Como cuidar de um cachorro?')">🐶 Cães</button><button onclick="ask('Onde vivem os leões?')">🦁 Leões</button><button onclick="ask('Quero identificar um animal')">🔎 Identificar</button></div><form onsubmit="send(event)"><input id="input" placeholder="Pergunte sobre um animal..."><button>➤</button></form><footer>WorldIA — primeira versão do chat 🌍</footer></div><script>const c=document.getElementById('chat'),i=document.getElementById('input');function add(t,k){let d=document.createElement('div');d.className='msg '+k;d.innerHTML=t;c.appendChild(d);c.scrollTop=c.scrollHeight}function answer(q){q=q.toLowerCase();if(q.includes('guppy'))return'🐟 <b>Guppy</b><br>É um peixe de água doce. Come ração própria e pequenos alimentos apropriados. Boa qualidade da água é muito importante.';if(q.includes('cachorro')||q.includes('cão'))return'🐶 <b>Cães</b><br>Precisam de água limpa, alimentação adequada, exercício, higiene e cuidados veterinários.';if(q.includes('leão'))return'🦁 <b>Leões</b><br>São grandes felinos africanos que vivem principalmente em savanas e outras áreas abertas. São animais selvagens.';if(q.includes('identificar')||q.includes('foto'))return'🔎 <b>Identificação</b><br>Na próxima versão vamos adicionar uma função para enviar uma foto e tentar identificar o animal.';if(q.includes('oi')||q.includes('olá')||q.includes('ola'))return'Olá! 👋 Eu sou o WorldIA. Pergunte-me sobre qualquer animal 🐾';return'🐾 Boa pergunta! Nesta versão ainda estou aprendendo. Experimente perguntar sobre <b>guppys, cães ou leões</b>.'}function send(e){e.preventDefault();let q=i.value.trim();if(!q)return;add(q,'user');i.value='';setTimeout(()=>add(answer(q),'bot'),300)}function ask(q){i.value=q;document.querySelector('form').requestSubmit()}</script></body></html>
